name: Build with PyInstaller

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-latest, macos-13, ubuntu-22.04]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Create and activate virtual environment
      shell: bash
      run: |
        python -m venv venv
        source venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyInstaller
      shell: bash
      run: |
        pyinstaller src/main.py

    - name: Setup Pyright
      shell: bash
      run: |
        mkdir dist/main/_internal/pyright
        cp res/pyright-1.1.188.tgz dist/main/_internal/pyright

    - name: Copy Dependencies (Linux)
      shell: bash
      run: |
        cp res/linux/* dist/main/_internal
      if: runner.os == 'Linux'

    # - name: Copy Dependencies (MacOs)
    #   shell: bash
    #   run: |
    #     cp res/mac/* dist/main/_internal
    #   if: runner.os == 'macOS'

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: dist
        retention-days: 7